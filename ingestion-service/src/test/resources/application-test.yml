  # 2. JPA 설정
  jpa:
    # XML 매핑 파일 위치 지정 (기본값이 META-INF/orm.xml 이지만 명시 권장)
    mapping-resources: META-INF/orm.xml
    # Hibernate 설정
    hibernate:
      ddl-auto: validate # 운영 중엔 validate 또는 none 사용
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true # 로그에 SQL 예쁘게 출력
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 30000
            readTimeout: 30000 # 5분

  batch:
    job:
      enabled: false  # [핵심] 애플리케이션 시작 시 Job 자동 실행 끄기
    jdbc:
      initialize-schema: never

