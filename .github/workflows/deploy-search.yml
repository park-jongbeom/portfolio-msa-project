name: Deploy Search Service

on:
  push:
    branches: [ "master" ]
    paths:
      - 'search-service/**' # 이 폴더가 바뀔 때만 실행
      - 'common-module/**'  # 공통 모듈이 바뀌어도 실행
      - '.github/workflows/deploy-search.yml'

env:
  DOCKER_IMAGE: patrick5471/search-service
  CONTAINER_NAME: search-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean :search-service:bootJar -x test
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./search-service/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
      - name: Deploy to Lightsail Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_DATASOURCE_URL_R2DBC: ${{ secrets.SPRING_DATASOURCE_URL_R2DBC }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CONTAINER_NAME: search-service
          DOCKER_IMAGE: patrick5471/search-service
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: CONTAINER_NAME, DOCKER_IMAGE, SPRING_DATASOURCE_URL_R2DBC, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
          script: |
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            
            sudo docker image prune -f
            
            sudo docker pull $DOCKER_IMAGE:latest
            
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --network host \
              -e SERVER_PORT=3002 \
              -e TZ=Asia/Seoul \
              -e JAVA_TOOL_OPTIONS="-Xmx400m" \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL_R2DBC=SPRING_DATASOURCE_URL_R2DBC \
              -e SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME \
              -e SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD \
              $DOCKER_IMAGE:latest