name: Deploy API Gateway Service

on:
  push:
    branches: [ "master" ] # 브랜치명 확인 (main 또는 master)
    paths:
      - 'api-gateway-service/**'
      - 'common-module/**'
      - '.github/workflows/deploy-gateway.yml'

env:
  DOCKER_IMAGE: patrick5471/api-gateway-service
  CONTAINER_NAME: api-gateway-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Gateway 모듈 빌드
      - name: Build with Gradle
        run: ./gradlew clean :api-gateway-service:bootJar -x test

      # 2. Docker 이미지 빌드 & 푸시
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api-gateway-service/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

      # 3. 서버 배포
      - name: Deploy to Lightsail Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          CONTAINER_NAME: api-gateway-service
          DOCKER_IMAGE: patrick5471/api-gateway-service
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: CONTAINER_NAME, DOCKER_IMAGE, HOST_IP
          script: |
            # 기존 컨테이너 중지 및 삭제
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            
            # 이미지 업데이트
            sudo docker image prune -f
            sudo docker pull $DOCKER_IMAGE:latest
            
            # 컨테이너 실행
            # --network host를 쓰므로 localhost로 통신 가능하지만, 명시적으로 IP를 주입합니다.
            sudo docker run -d \
            --name $CONTAINER_NAME \
            --network host \
            -e SERVER_PORT=3003 \
            -e TZ=Asia/Seoul \
            -e JAVA_TOOL_OPTIONS="-Xmx400m" \
            -e SPRING_PROFILES_ACTIVE=prod \
            $DOCKER_IMAGE:latest