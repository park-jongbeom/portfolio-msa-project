name: Deploy Ingestion Service

on:
  push:
    branches: [ "master" ]
    paths:
      - 'ingestion-service/**'        # 이 폴더가 바뀔 때만 동작
      - 'common-module/**'            # 공통 모듈이 바뀌어도 실행
      - '.github/workflows/deploy-ingestion.yml'

env:
  DOCKER_IMAGE: patrick5471/ingestion-service
  CONTAINER_NAME: ingestion-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean :ingestion-service:bootJar -x test
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ingestion-service/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
      - name: Deploy to Lightsail Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_FILE_PATH: ${{ secrets.APP_FILE_PATH }}
          CONTAINER_NAME: ingestion-service
          DOCKER_IMAGE: patrick5471/ingestion-service
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: CONTAINER_NAME, DOCKER_IMAGE, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, APP_FILE_PATH
          script: |
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            
            sudo docker image prune -f
            
            sudo docker pull $DOCKER_IMAGE:latest
            
            sudo docker run -d \
              --name $CONTAINER_NAME \
              --network host \
              -e SERVER_PORT=3001 \
              -e TZ=Asia/Seoul \
              -e JAVA_TOOL_OPTIONS="-Xmx400m" \
              -v /home/ubuntu/data:/data/download \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e APP_DRUG_DATA_FILE_PATH=$APP_FILE_PATH \
              -e SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL \
              -e SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME \
              -e SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD \
              $DOCKER_IMAGE:latest